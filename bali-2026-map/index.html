<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бали 2026 - карта маршрута</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--bg:#f4f6f3;--panel:#fff;--text:#17211b;--muted:#5e6b61;--line:#d8ded8;--base:#166534;--day:#1d4ed8;--airport:#4b5563;--ferry:#7c3aed;--optional:#a16207}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{display:grid;grid-template-columns:minmax(320px,390px) minmax(0,1fr);min-height:100vh}aside{display:flex;flex-direction:column;gap:18px;padding:22px;overflow:auto;background:var(--panel);border-right:1px solid var(--line)}h1{margin:0;font-size:26px;line-height:1.15}.subhead{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.45}.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:14px;border:1px solid var(--line);border-radius:8px;background:#fbfcfb;font-size:13px}.legend-item{display:inline-flex;align-items:center;gap:7px;min-width:0;color:var(--muted)}.dot{width:12px;height:12px;flex:0 0 12px;border-radius:999px;background:var(--day)}.base{background:var(--base)!important}.day{background:var(--day)!important}.airport{background:var(--airport)!important}.ferry{background:var(--ferry)!important}.optional{background:var(--optional)!important}.route-list{display:grid;gap:8px}button.point{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);text-align:left;cursor:pointer}button.point:hover,button.point:focus-visible{border-color:#93b3a1;outline:none;background:#f8fbf8}.num{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:999px;color:#fff;font-weight:800;font-size:13px}.point-title{display:block;overflow-wrap:anywhere;font-size:14px;line-height:1.25;font-weight:700}.point-meta{display:block;margin-top:4px;color:var(--muted);font-size:12px;line-height:1.3}main{position:relative;min-width:0;min-height:100vh}#map{position:absolute;inset:0;min-height:100vh}.number-marker{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border:3px solid #fff;border-radius:999px;color:#fff;box-shadow:0 2px 8px rgba(15,23,42,.38);font-size:13px;font-weight:900;line-height:1}.leaflet-popup-content{margin:14px 16px;min-width:230px;color:var(--text)}.popup-title{margin:0 0 7px;font-size:16px;line-height:1.2;font-weight:800}.popup-meta{margin:0 0 8px;color:var(--muted);font-size:13px;line-height:1.35}.popup-desc{margin:0;font-size:13px;line-height:1.45}@media(max-width:860px){body{grid-template-columns:1fr;grid-template-rows:auto minmax(520px,68vh)}aside{max-height:42vh;border-right:0;border-bottom:1px solid var(--line)}main,#map{min-height:520px}}</style></head><body><aside><header><h1>Бали 2026 - карта маршрута</h1><p class="subhead">Номерные пины показывают порядок маршрута. Клик по пину или пункту списка открывает описание точки.</p></header><section class="legend" aria-label="Легенда карты"><span class="legend-item"><span class="dot airport"></span>Аэропорт</span><span class="legend-item"><span class="dot base"></span>База</span><span class="legend-item"><span class="dot day"></span>Выезд</span><span class="legend-item"><span class="dot ferry"></span>Паром</span><span class="legend-item"><span class="dot optional"></span>Optional</span></section><nav class="route-list" id="route-list" aria-label="Точки маршрута"></nav></aside><main><div id="map" aria-label="Интерактивная карта Бали"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const points=[{order:1,title:"DPS Airport - прилёт/вылет",type:"airport",role:"19 Oct arrival / 7 Nov departure",lat:-8.7467,lng:115.1672,description:"Аэропорт Denpasar / Ngurah Rai. Точка позднего прилёта 19 октября и ночного обратного вылета 7 ноября."},{order:2,title:"Canggu / Berawa / Umalas - первая база",type:"base",role:"19-23 Oct",lat:-8.6617,lng:115.1616,description:"Западный кластер рядом с сестрой: кафе, пляжи, закаты и мягкая адаптация после перелёта."},{order:3,title:"Tanah Lot - храм на скале",type:"day",role:"west coast sunset option",lat:-8.6212,lng:115.0868,description:"Храм на морской скале. Логичный закатный выезд из Canggu / Umalas."},{order:4,title:"Ubud - центральная база",type:"base",role:"23-28 Oct",lat:-8.5069,lng:115.2625,description:"Центр острова: рисовые террасы, храмы, водопады, джунгли и вулканический блок."},{order:5,title:"Monkey Forest - лес с обезьянами",type:"day",role:"Ubud local block",lat:-8.5194,lng:115.2606,description:"Лес с обезьянами в центре Убуда. Ребёнку может быть интересно, но еду и мелкие вещи держать закрыто."},{order:6,title:"Tegallalang - рисовые террасы",type:"day",role:"rice terraces",lat:-8.4311,lng:115.2798,description:"Знаменитые рисовые террасы к северу от Убуда. Лучше ехать утром до жары и толп."},{order:7,title:"Tirta Empul - храм с источниками",type:"day",role:"temple / water ritual",lat:-8.4159,lng:115.3153,description:"Балийский храм с источниками и ритуальным омовением. Культурная остановка рядом с Tegallalang."},{order:8,title:"Mount Batur / Kintamani - вулкан",type:"day",role:"sunrise jeep / volcano",lat:-8.2422,lng:115.3754,description:"Вулканический район. Для семьи логичнее sunrise jeep tour, а не пеший подъём; ребёнка по плану не брать."},{order:9,title:"Tegenungan Waterfall - водопад",type:"day",role:"waterfall / fallback",lat:-8.5755,lng:115.2892,description:"Доступный водопад недалеко от Убуда. Хорош как лёгкий природный день или fallback."},{order:10,title:"Umalas - свадебный блок",type:"base",role:"28 Oct-1 Nov, fixed 30 Oct-1 Nov",lat:-8.665,lng:115.1628,description:"Ключевой семейный район рядом с домом сестры. 30 октября свадьба, 30 октября - 1 ноября уже фиксированы 2 ночи."},{order:11,title:"Uluwatu / Bukit - южная база",type:"base",role:"1-4 Nov",lat:-8.8291,lng:115.0849,description:"Южные скалы, видовые пляжи, закаты и храм Uluwatu. Отдельная база, чтобы не ездить туда-сюда из Umalas."},{order:12,title:"Melasti Beach - семейный пляж",type:"day",role:"family beach",lat:-8.8475,lng:115.162,description:"Красивый южный пляж с удобным подъездом между скалами. Один из лучших семейных пляжных вариантов на Bukit."},{order:13,title:"Uluwatu Temple - храм + Kecak",type:"day",role:"temple + Kecak",lat:-8.8291,lng:115.0849,description:"Храм на высокой скале над океаном. Вечером можно смотреть Kecak dance - представление с хором и огнём."},{order:14,title:"Jimbaran seafood - ужин на песке",type:"day",role:"dinner option",lat:-8.7789,lng:115.1665,description:"Пляжная бухта с ужином из рыбы и морепродуктов на песке. Хороший вечерний сценарий после юга."},{order:15,title:"Keramas Beach - чёрный песок",type:"day",role:"black sand stop",lat:-8.6042,lng:115.3364,description:"Пляж с чёрным вулканическим песком. Лучше встроить как остановку по дороге к Sanur или коротким выездом из Sanur."},{order:16,title:"Sanur - финальная база",type:"base",role:"4-7 Nov",lat:-8.6933,lng:115.2631,description:"Спокойная финальная база: набережная, рассветы, лодки на острова и удобный выезд в аэропорт."},{order:17,title:"Sanur Port - порт на острова",type:"ferry",role:"island day start",lat:-8.6742,lng:115.263,description:"Порт отправления лодок на Nusa Lembongan / Ceningan и Nusa Penida. Нужен запас на посадку."},{order:18,title:"Nusa Lembongan / Ceningan - островной день",type:"day",role:"default island day",lat:-8.6786,lng:115.4556,description:"Основной островной day trip: вода, пляжи, кафе, snorkeling и возвращение в Sanur вечером."},{order:19,title:"Nusa Dua / Geger Beach - optional пляж",type:"optional",role:"calm final beach",lat:-8.8102,lng:115.2263,description:"Спокойный resort-пляжный вариант на финал, если не хочется островов или дальних перемещений."},{order:20,title:"Nusa Penida - hard optional",type:"optional",role:"hard optional island",lat:-8.7278,lng:115.5444,description:"Красивый, но тяжёлый островной вариант: дороги, жара и много переездов. С ребёнком только осознанно."}];const typeLabels={airport:"Аэропорт",base:"База",day:"Выезд",ferry:"Паром",optional:"Optional"};const map=L.map("map",{zoomControl:true,scrollWheelZoom:true});L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap contributors"}).addTo(map);const markers=new Map(),bounds=L.latLngBounds(points.map(p=>[p.lat,p.lng]));function markerIcon(p){return L.divIcon({className:"",html:`<span class="number-marker ${p.type}">${p.order}</span>`,iconSize:[30,30],iconAnchor:[15,15],popupAnchor:[0,-16]})}function popupContent(p){return `<h2 class="popup-title">${String(p.order).padStart(2,"0")}. ${p.title}</h2><p class="popup-meta">${typeLabels[p.type]} · ${p.role}</p><p class="popup-desc">${p.description}</p>`}points.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:markerIcon(p),title:`${String(p.order).padStart(2,"0")}. ${p.title}`}).addTo(map);m.bindPopup(popupContent(p));markers.set(p.order,m)});function coords(route){return route.map(order=>{const p=points.find(item=>item.order===order);return[p.lat,p.lng]})}L.polyline(coords([1,2,4,10,11,16,1]),{color:"#0f766e",weight:4,opacity:.86}).addTo(map);L.polyline(coords([16,17,18,17,16]),{color:"#7c3aed",weight:3,opacity:.78,dashArray:"8 8"}).addTo(map);[[11,15,16],[16,19],[17,20]].forEach(route=>L.polyline(coords(route),{color:"#a16207",weight:2,opacity:.68,dashArray:"4 8"}).addTo(map));function fitRouteBounds(){map.invalidateSize();map.fitBounds(bounds.pad(.16))}fitRouteBounds();window.addEventListener("load",()=>setTimeout(fitRouteBounds,250));window.addEventListener("resize",()=>setTimeout(fitRouteBounds,120));const list=document.getElementById("route-list");points.forEach(p=>{const b=document.createElement("button");b.className="point";b.type="button";b.innerHTML=`<span class="num ${p.type}">${p.order}</span><span><span class="point-title">${String(p.order).padStart(2,"0")}. ${p.title}</span><span class="point-meta">${typeLabels[p.type]} · ${p.role}</span></span>`;b.addEventListener("click",()=>{const m=markers.get(p.order);map.setView([p.lat,p.lng],Math.max(map.getZoom(),12),{animate:true});m.openPopup()});list.appendChild(b)});</script></body></html>
