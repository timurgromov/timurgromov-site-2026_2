services:
  site:
    build:
      context: .
    container_name: timurgromov-site-local
    ports:
      - "4323:4323"
    working_dir: /app
    command: sh -lc "npm run build && npm run preview -- --host 0.0.0.0 --port 4323"
    volumes:
      - .:/app
      - timurgromov_site_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  timurgromov_site_node_modules:
